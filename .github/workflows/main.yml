name: Generate Snake

on:
  # runs every night at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # and you can also trigger it manually
  workflow_dispatch:

# allow the workflow to push to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Generate fancy snakes
      - name: Generate GitHub contribution snakes
        uses: Platane/snk@v3
        with:
          # change this only if your GitHub username is different
          github_user_name: MohammadMDX

          # list of files to generate (one per line)
          # we customize colors using query params
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#a855f7&color_dots=#0f172a,#22c55e,#a855f7,#f97316,#facc15
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a855f7&color_dots=#020617,#0f172a,#22c55e,#a855f7,#facc15
            dist/github-contribution-grid-snake-neon.gif?color_snake=#a855f7&color_dots=#020617,#22c55e,#a855f7,#f97316,#facc15

      # 3) Publish the generated files to the `output` branch
      - name: Publish snakes to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
